<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerPilot AI</title>
    <meta name="description" content="Your AI-Powered Placement & Career Copilot for engineering students, featuring AI Career Mentor, Placement Practice, Resume Analyzer, Coding Arena, and Technical Mock Interviews." />
    <meta property="og:title" content="CareerPilot AI" />
    <meta property="og:description" content="Your AI-Powered Placement & Career Copilot for engineering students, featuring AI Career Mentor, Placement Practice, Resume Analyzer, Coding Arena, and Technical Mock Interviews." />
    <script>
      (function() {
        // Prevent benign ResizeObserver loop errors from surfacing in unhandled error dialogs
        window.addEventListener('error', function(e) {
          if (
            e &&
            (e.message === 'ResizeObserver loop completed with undelivered notifications.' ||
              e.message === 'ResizeObserver loop limit exceeded' ||
              (typeof e.message === 'string' && e.message.indexOf('ResizeObserver') !== -1))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        });

        try {
          var saved = localStorage.getItem('careerpilot_theme');
          var isLight = saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
